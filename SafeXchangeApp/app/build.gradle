android {
    namespace 'com.app.safexchange'
    compileSdk 36

    defaultConfig {
        applicationId "com.app.safexchange"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Physical phone on same Wi‑Fi as this Mac (update IP if your Mac IP changes).
        // Emulator only: use http://10.0.2.2:5001/api/
        buildConfigField "String", "API_BASE_URL", "\"http://10.141.49.192:5001/api/\""
        buildConfigField "String", "ADMIN_WEB_BASE", "\"http://10.141.49.192:5173\""
    }

    buildTypes {
        debug {
            // Optional override examples:
            // Emulator:  "http://10.0.2.2:5001/api/"
            // LAN phone: "http://10.141.49.192:5001/api/"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "API_BASE_URL", "\"https://api.safexchange.io/api/\""
            buildConfigField "String", "ADMIN_WEB_BASE", "\"https://safexchange.io\""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

